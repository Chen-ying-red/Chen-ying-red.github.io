<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- PWA Theme Color -->
    <meta name="theme-color" content="#171717">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>极速魔方计时器 | SpeedCube Timer</title>

    <!-- Web App Manifest -->
    <link rel="manifest" id="manifest-placeholder">

    <!-- CSS / Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <script src="https://cdn.tailwindcss.com" async></script>
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
            overscroll-behavior: none;
        }
        
        .timer-font {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .scramble-text {
            letter-spacing: 0.5px;
            line-height: 1.3;
            text-align: center;
            white-space: pre-wrap; 
            word-break: break-word;
        }

        .timer-idle { color: #e5e5e5; }
        .timer-holding { color: #ef4444; }
        .timer-ready { color: #22c55e; }
        .timer-running { color: #e5e5e5; }

        #touchArea {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        header { padding-top: env(safe-area-inset-top, 16px); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 16px); }

        #historyList::-webkit-scrollbar { width: 4px; }
        #historyList::-webkit-scrollbar-thumb { background: #404040; border-radius: 2px; }

        /* SVG Styles */
        .cube-face { stroke: #000; stroke-width: 1px; }
        /* WCA Colors */
        .c-w { fill: #ffffff; }
        .c-y { fill: #ffd500; }
        .c-g { fill: #009e60; }
        .c-b { fill: #0051ba; }
        .c-r { fill: #c41e3a; }
        .c-o { fill: #ff5800; }
        .c-x { fill: #444444; }

        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            -webkit-appearance: none;
            appearance: none;
        }

        /* Splash Screen Animation */
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Startup Splash Screen -->
    <div id="splashScreen" class="fixed inset-0 z-50 bg-[#1a1a1a] flex flex-col items-center justify-center transition-opacity duration-500 ease-out">
        <div class="animate-bounce mb-6">
            <svg class="w-20 h-20 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
        </div>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tighter text-white mb-10" style="font-family: 'Montserrat', sans-serif;">
            CUBE<span class="text-blue-500">TIMER</span>
        </h1>
        <div class="animate-pulse flex flex-col items-center gap-2">
            <p class="text-neutral-400 text-sm md:text-lg tracking-[0.2em] uppercase font-bold text-center px-4">
                按下空格或长按屏幕开始计时
            </p>
            <p class="text-neutral-600 text-[10px] md:text-xs tracking-widest uppercase mt-2">
                Press Space or Hold Screen to Start
            </p>
        </div>
    </div>

    <!-- Navbar with GAN-style Logo -->
    <header class="flex justify-between items-center px-4 md:px-6 py-3 bg-neutral-900 border-b border-neutral-800 shrink-0 z-30">
        <div class="flex items-center gap-2">
            <!-- New Minimalist Logo Icon -->
            <svg class="w-8 h-8 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <div class="flex flex-col justify-center">
                <h1 class="text-xl font-extrabold tracking-tighter text-white leading-none" style="font-family: 'Montserrat', sans-serif;">
                    CUBE<span class="text-blue-500">TIMER</span>
                </h1>
                <span class="text-[0.5rem] tracking-[0.2em] text-neutral-500 uppercase font-bold">Professional</span>
            </div>
        </div>
        <div class="flex gap-3 items-center">
            <button id="installBtn" onclick="installApp()" class="hidden bg-blue-600 hover:bg-blue-500 text-white text-[10px] md:text-xs font-bold py-1 px-3 rounded-full transition">APP</button>
            <button onclick="clearHistory()" class="text-neutral-400 hover:text-red-400 p-2"><i class="fas fa-trash-alt"></i></button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative overflow-hidden" id="touchArea">
        
        <!-- Top Control Bar -->
        <div class="flex justify-center pt-2 z-20">
            <div class="relative">
                <select id="puzzleType" onchange="changePuzzleType()" class="bg-neutral-800 text-white text-xs md:text-sm font-bold py-1 pl-3 pr-8 rounded-full border border-neutral-700 focus:outline-none focus:border-blue-500 transition cursor-pointer">
                    <option value="333">3x3x3</option>
                    <option value="222">2x2x2</option>
                    <option value="444">4x4x4</option>
                </select>
            </div>
        </div>

        <!-- Scramble Area -->
        <div class="px-4 mt-1 flex flex-col items-center z-10 shrink-0">
            <!-- Scramble Text -->
            <div id="scrambleDisplay" class="scramble-text text-sm md:text-xl font-medium text-neutral-300 max-w-4xl cursor-pointer hover:text-white transition active:scale-95 mb-2 mt-2" onclick="newScramble()">
                Initializing...
            </div>

            <!-- Scramble Visualization (SVG) -->
            <!-- 增加至 200px (md) / 160px (mobile) -->
            <div id="visualizer" class="w-full flex justify-center h-[160px] md:h-[200px] transition-opacity duration-300 opacity-0">
                <!-- SVG injected by JS -->
            </div>
        </div>

        <!-- Timer Display -->
        <div class="flex-1 flex items-center justify-center flex-col z-10 min-h-0">
            <div id="timerDisplay" class="timer-font text-[24vw] md:text-[12rem] lg:text-[14rem] font-bold leading-none timer-idle select-none transition-colors duration-100">
                0.00
            </div>
            <!-- Instruction text -->
            <div id="instruction" class="mt-2 md:mt-4 text-neutral-600 text-[10px] md:text-xs uppercase tracking-wider text-center opacity-60">
                <span class="hidden md:block">Press Space to Start</span>
                <span class="md:hidden">Hold Screen to Start</span>
            </div>
        </div>

        <!-- Footer Stats -->
        <div class="w-full bg-neutral-900/90 backdrop-blur-sm border-t border-neutral-800 p-2 md:p-4 z-20 safe-bottom shrink-0">
            <div class="max-w-4xl mx-auto grid grid-cols-4 gap-2 md:gap-4 text-center">
                <div class="flex flex-col"><span class="text-[10px] text-neutral-500 font-bold">SOLVES</span><span id="statCount" class="text-base font-bold">0</span></div>
                <div class="flex flex-col"><span class="text-[10px] text-neutral-500 font-bold">BEST</span><span id="statBest" class="text-base font-bold text-blue-400">--</span></div>
                <div class="flex flex-col"><span class="text-[10px] text-neutral-500 font-bold">Ao5</span><span id="statAo5" class="text-base font-bold text-yellow-400">--</span></div>
                <div class="flex flex-col"><span class="text-[10px] text-neutral-500 font-bold">Ao12</span><span id="statAo12" class="text-base font-bold text-purple-400">--</span></div>
            </div>
        </div>
    </main>

    <!-- History Sidebar -->
    <div class="bg-neutral-950 border-t border-neutral-800 h-32 md:h-56 flex flex-col shrink-0">
        <div class="px-4 py-2 bg-neutral-900 flex justify-between items-center border-b border-neutral-800">
            <span class="text-[10px] font-bold text-neutral-400 uppercase tracking-wider">HISTORY</span>
        </div>
        <div id="historyList" class="flex-1 overflow-y-auto p-2 grid grid-cols-2 lg:grid-cols-4 gap-2 content-start"></div>
    </div>

    <!-- Scripts -->
    <script>
        // --- Splash Screen Logic ---
        function dismissSplash() {
            const splash = document.getElementById('splashScreen');
            if (splash && !splash.classList.contains('fade-out')) {
                splash.classList.add('fade-out');
                setTimeout(() => {
                    if(splash.parentNode) splash.parentNode.removeChild(splash);
                }, 500);
                return true; // 成功消除 Splash
            }
            return false; // Splash 已经不存在或正在消除
        }

        // --- 1. 魔方逻辑引擎 (Cube Engine) ---
        const COLORS = { U: 'c-w', R: 'c-r', F: 'c-g', D: 'c-y', L: 'c-o', B: 'c-b' };
        
        function getSolvedState(size) {
            const faces = ['U', 'R', 'F', 'D', 'L', 'B'];
            const state = {};
            faces.forEach(f => {
                state[f] = Array(size * size).fill(COLORS[f]);
            });
            return state;
        }

        const MOVES_333 = {
            'U': () => cycleFace(, 'U', [0,1,2,5,8,7,6,3]) & cycleSides(, ['F', 'L', 'B', 'R'], [[0,1,2], [0,1,2], [0,1,2], [0,1,2]]),
            'D': () => cycleFace(, 'D', [0,1,2,5,8,7,6,3]) & cycleSides(, ['F', 'R', 'B', 'L'], [[6,7,8], [6,7,8], [6,7,8], [6,7,8]]),
            'F': () => cycleFace(, 'F', [0,1,2,5,8,7,6,3]) & cycleSides(, ['U', 'R', 'D', 'L'], [[6,7,8], [0,3,6], [2,1,0], [8,5,2]]),
            'B': () => cycleFace(, 'B', [0,1,2,5,8,7,6,3]) & cycleSides(, ['U', 'L', 'D', 'R'], [[2,1,0], [0,3,6], [6,7,8], [8,5,2]]),
            'L': () => cycleFace(, 'L', [0,1,2,5,8,7,6,3]) & cycleSides(, ['U', 'F', 'D', 'B'], [[0,3,6], [0,3,6], [0,3,6], [8,5,2]]),
            'R': () => cycleFace(, 'R', [0,1,2,5,8,7,6,3]) & cycleSides(, ['U', 'B', 'D', 'F'], [[8,5,2], [0,3,6], [8,5,2], [8,5,2]]),
        };

        const MOVES_222 = {
            'U': () => cycleFace(, 'U', [0,1,3,2]) & cycleSides(, ['F', 'L', 'B', 'R'], [[0,1], [0,1], [0,1], [0,1]]),
            'D': () => cycleFace(, 'D', [0,1,3,2]) & cycleSides(, ['F', 'R', 'B', 'L'], [[2,3], [2,3], [2,3], [2,3]]),
            'F': () => cycleFace(, 'F', [0,1,3,2]) & cycleSides(, ['U', 'R', 'D', 'L'], [[2,3], [0,2], [1,0], [3,1]]),
            'B': () => cycleFace(, 'B', [0,1,3,2]) & cycleSides(, ['U', 'L', 'D', 'R'], [[1,0], [0,2], [2,3], [3,1]]),
            'L': () => cycleFace(, 'L', [0,1,3,2]) & cycleSides(, ['U', 'F', 'D', 'B'], [[0,2], [0,2], [0,2], [3,1]]),
            'R': () => cycleFace(, 'R', [0,1,3,2]) & cycleSides(, ['U', 'B', 'D', 'F'], [[1,3], [2,0], [1,3], [1,3]]),
        };

        function cycleFace(state, face, indices) {
            const arr = state[face];
            const old = [...arr];
            if(indices.length === 8) { 
                const map = [6,3,0,7,4,1,8,5,2];
                const newFace = arr.map((_, i) => old[map[i]]);
                state[face] = newFace;
            } else if (indices.length === 4) {
                const map = [2,0,3,1];
                const newFace = arr.map((_, i) => old[map[i]]);
                state[face] = newFace;
            }
            return 1;
        }

        function cycleSides(state, faces, indicesList) {
            const vals = faces.map((f, i) => indicesList[i].map(idx => state[f][idx]));
            indicesList[1].forEach((idx, i) => state[faces[1]][idx] = vals[0][i]);
            indicesList[2].forEach((idx, i) => state[faces[2]][idx] = vals[1][i]);
            indicesList[3].forEach((idx, i) => state[faces[3]][idx] = vals[2][i]);
            indicesList[0].forEach((idx, i) => state[faces[0]][idx] = vals[3][i]);
            return 1;
        }

        function applyMove(state, move, type) {
            const base = move[0];
            const mod = move.length > 1 ? move.slice(1) : "";
            const moveFunc = type === '333' ? MOVES_333[base] : MOVES_222[base];
            if (!moveFunc) return;
            let times = 1;
            if (mod === "2") times = 2;
            else if (mod === "'") times = 3;
            for(let k=0; k<times; k++) moveFunc(state);
        }

        function renderCubeSVG(state, type) {
            const size = type === '222' ? 2 : 3;
            const cellSize = 15;
            const gap = 2;
            const faceSize = size * cellSize;
            const offsets = {
                U: [faceSize + gap, 0],
                L: [0, faceSize + gap],
                F: [faceSize + gap, faceSize + gap],
                R: [(faceSize + gap) * 2, faceSize + gap],
                B: [(faceSize + gap) * 3, faceSize + gap],
                D: [faceSize + gap, (faceSize + gap) * 2]
            };
            let svgHTML = `<svg width="100%" height="100%" viewBox="0 0 ${faceSize*4 + gap*3} ${faceSize*3 + gap*2}">`;
            ['U', 'L', 'F', 'R', 'B', 'D'].forEach(face => {
                const [ox, oy] = offsets[face];
                state[face].forEach((colorClass, idx) => {
                    const row = Math.floor(idx / size);
                    const col = idx % size;
                    svgHTML += `<rect x="${ox + col*cellSize}" y="${oy + row*cellSize}" width="${cellSize}" height="${cellSize}" class="cube-face ${colorClass}" />`;
                });
            });
            svgHTML += '</svg>';
            return svgHTML;
        }

        // --- 2. 核心 App 逻辑 ---

        let currentPuzzle = '333';
        let currentScrambleStr = '';
        let appState = 'IDLE'; 
        let timerStart = 0;
        let timerInt = null;
        let holdingTimeout = null;
        let solves = [];

        const elTimer = document.getElementById('timerDisplay');
        const elScramble = document.getElementById('scrambleDisplay');
        const elVisualizer = document.getElementById('visualizer');
        const elSelect = document.getElementById('puzzleType');
        const elInstruction = document.getElementById('instruction');

        // --- 修复关键：立即执行初始化 ---
        (function initImmediately() {
            const interval = setInterval(() => {
                const display = document.getElementById('scrambleDisplay');
                const viz = document.getElementById('visualizer');
                if (display && viz) {
                    newScramble();
                    clearInterval(interval);
                }
            }, 50);
            setTimeout(() => clearInterval(interval), 5000);
        })();

        window.addEventListener('DOMContentLoaded', () => {
            loadHistory();
            if (!currentScrambleStr) newScramble();
            setupPWA();
        });

        function changePuzzleType() {
            currentPuzzle = elSelect.value;
            if (currentPuzzle === '444') {
                elVisualizer.style.display = 'none';
            } else {
                elVisualizer.style.display = 'flex';
            }
            newScramble();
        }

        function newScramble() {
            if (appState === 'RUNNING') return;
            
            currentScrambleStr = generateScrambleText(currentPuzzle);
            const scrambleDisplay = document.getElementById('scrambleDisplay');
            if(scrambleDisplay) scrambleDisplay.innerText = currentScrambleStr;

            if (currentPuzzle !== '444') {
                const state = getSolvedState(currentPuzzle === '222' ? 2 : 3);
                const moves = currentScrambleStr.split(' ');
                moves.forEach(m => applyMove(state, m, currentPuzzle));
                const viz = document.getElementById('visualizer');
                if(viz) {
                    viz.innerHTML = renderCubeSVG(state, currentPuzzle);
                    viz.style.opacity = '1';
                }
            }
        }

        function generateScrambleText(type) {
            let moves = [];
            let len = 20;
            let axis = []; 
            
            if (type === '222') {
                len = 9;
                axis = ['R', 'U', 'F']; 
            } else if (type === '333') {
                len = 20;
                axis = ['R', 'L', 'U', 'D', 'F', 'B'];
            } else if (type === '444') {
                len = 40;
                axis = ['R', 'L', 'U', 'D', 'F', 'B', 'Rw', 'Uw', 'Fw']; 
            }

            let lastAxis = -1;
            
            for(let i=0; i<len; i++) {
                let r;
                do {
                    r = Math.floor(Math.random() * axis.length);
                } while (getBaseAxis(axis[r]) === lastAxis); 
                
                lastAxis = getBaseAxis(axis[r]);
                
                let suffix = '';
                const rand = Math.random();
                if (rand < 0.33) suffix = "'";
                else if (rand < 0.66) suffix = "2";
                
                moves.push(axis[r] + suffix);
            }
            return moves.join(" ");
        }

        function getBaseAxis(move) {
            if (['R','L','Rw','Lw'].some(x => move.startsWith(x))) return 0;
            if (['U','D','Uw','Dw'].some(x => move.startsWith(x))) return 1;
            return 2;
        }

        // --- 3. 计时器逻辑 ---

        function updateTimer() {
            const now = Date.now();
            const diff = now - timerStart;
            let  = Math.floor(diff / 1000);
            let ms = Math.floor((diff % 1000) / 10);
            elTimer.innerText = `${}.${ms.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            appState = 'RUNNING';
            timerStart = Date.now();
            elTimer.className = 'timer-font text-[24vw] md:text-[12rem] lg:text-[14rem] font-bold leading-none timer-running';
            
            elInstruction.style.opacity = '0';
            elVisualizer.style.opacity = '0';
            elScramble.style.opacity = '0';
            
            timerInt = setInterval(updateTimer, 10);
        }

        function stopTimer() {
            clearInterval(timerInt);
            const finalTime = Date.now() - timerStart;
            appState = 'IDLE';
            
            let  = Math.floor(finalTime / 1000);
            let ms = Math.floor((finalTime % 1000) / 10);
            elTimer.innerText = `${}.${ms.toString().padStart(2, '0')}`;
            elTimer.className = 'timer-font text-[24vw] md:text-[12rem] lg:text-[14rem] font-bold leading-none timer-idle';

            elInstruction.style.opacity = '0.6';
            elVisualizer.style.opacity = '1';
            elScramble.style.opacity = '1';

            saveSolve(finalTime);
            newScramble();
        }

        // --- 4. 交互 (Touch/Keyboard) ---
        
        function handleDown() {
            // 如果成功消除了 Splash，直接返回，不进入 IDLE -> HOLDING 逻辑
            if (dismissSplash()) {
                return;
            }

            if (appState === 'RUNNING') {
                stopTimer();
                return;
            }
            if (appState === 'IDLE') {
                appState = 'HOLDING';
                elTimer.className = 'timer-font text-[24vw] md:text-[12rem] lg:text-[14rem] font-bold leading-none timer-holding';
                elTimer.innerText = "0.00";
                
                holdingTimeout = setTimeout(() => {
                    if (appState === 'HOLDING') {
                        appState = 'READY';
                        elTimer.className = 'timer-font text-[24vw] md:text-[12rem] lg:text-[14rem] font-bold leading-none timer-ready';
                    }
                }, 350); 
            }
        }

        function handleUp() {
            // 如果 Splash 刚刚被消除（或者还在消除中），直接忽略抬起动作
            if (dismissSplash()) {
                return;
            }

            if (appState === 'READY') {
                startTimer();
            } else if (appState === 'HOLDING') {
                clearTimeout(holdingTimeout);
                appState = 'IDLE';
                elTimer.className = 'timer-font text-[24vw] md:text-[12rem] lg:text-[14rem] font-bold leading-none timer-idle';
            }
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!e.repeat) handleDown();
            }
        });
        document.addEventListener('keyup', e => {
            if (e.code === 'Space') handleUp();
        });

        const touchArea = document.getElementById('touchArea');
        // 全局点击也可以消除 Splash，但为了逻辑统一，我们在 touchstart 处理
        document.addEventListener('touchstart', (e) => {
             // 如果在 Splash 上点击，消除它
             if(document.getElementById('splashScreen')) dismissSplash();
        });

        touchArea.addEventListener('touchstart', e => {
            if (!e.target.closest('button') && !e.target.closest('select') && !e.target.closest('.scramble-text')) {
                e.preventDefault();
                handleDown();
            }
        }, { passive: false });
        touchArea.addEventListener('touchend', e => {
            if (!e.target.closest('button') && !e.target.closest('select')) {
                handleUp();
            }
        });

        // --- 5. 历史与统计 ---
        
        function saveSolve(ms) {
            const  = { id: Date.now(), time: ms, type: currentPuzzle, scramble: currentScrambleStr };
            solves.unshift();
            localStorage.setItem('cubeSolvesV2', JSON.stringify(solves));
            renderHistory();
            updateStats();
        }

        function loadHistory() {
            const d = localStorage.getItem('cubeSolvesV2');
            if (d) solves = JSON.parse(d);
            renderHistory();
            updateStats();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            const filtered = solves.filter( => .type === currentPuzzle);
            
            filtered.slice(0, 50).forEach((, i) => {
                const el = document.createElement('div');
                el.className = "bg-neutral-800 rounded p-2 flex justify-between items-center border border-neutral-700 text-xs";
                
                let timeStr = (.time / 1000).toFixed(2);
                let tagColor = .type === '333' ? 'text-blue-400' : (.type === '222' ? 'text-yellow-400' : 'text-purple-400');
                
                el.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-neutral-500 w-4">${filtered.length - i}</span>
                        <span class="font-bold text-[10px] ${tagColor} border border-neutral-600 px-1 rounded">${.type}</span>
                        <span class="font-bold text-white text-sm">${timeStr}</span>
                    </div>
                    <button onclick="delSolve(${.id})" class="text-neutral-600 hover:text-red-400 px-2"><i class="fas fa-times"></i></button>
                `;
                list.appendChild(el);
            });
        }

        window.delSolve = function(id) {
            if(!confirm('Delete this solve?')) return;
            solves = solves.filter( => .id !== id);
            localStorage.setItem('cubeSolvesV2', JSON.stringify(solves));
            renderHistory();
            updateStats();
        };

        window.clearHistory = function() {
            if(!confirm('Clear all history?')) return;
            solves = [];
            localStorage.removeItem('cubeSolvesV2');
            renderHistory();
            updateStats();
        };

        function updateStats() {
            const filtered = solves.filter( => .type === currentPuzzle);
            document.getElementById('statCount').innerText = filtered.length;
            
            if (filtered.length > 0) {
                const best = Math.min(...filtered.map( => .time));
                document.getElementById('statBest').innerText = (best / 1000).toFixed(2);
            } else {
                document.getElementById('statBest').innerText = "--";
            }
            document.getElementById('statAo5').innerText = calcAoN(filtered, 5);
            document.getElementById('statAo12').innerText = calcAoN(filtered, 12);
        }

        function calcAoN(list, n) {
            if (list.length < n) return "--";
            const subset = list.slice(0, n).map( => .time).sort((a,b)=>a-b);
            let sum = 0;
            for(let i=1; i<n-1; i++) sum += subset[i];
            return (sum / (n-2) / 1000).toFixed(2);
        }

        // --- PWA ---
        function setupPWA() {
            const m = {
                name: "CubeTimer Pro",
                short_name: "CubeTimer",
                display: "standalone",
                start_url: ".",
                background_color: "#1a1a1a",
                theme_color: "#1a1a1a",
                icons: [{ src: "https://cdn-icons-png.flaticon.com/512/566/566300.png", sizes: "512x512", type: "image/png" }]
            };
            const b = new Blob([JSON.stringify(m)], {type: 'application/json'});
            document.getElementById('manifest-placeholder').href = 网站.createObjectURL(b);
        }
        
        let prompt;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            prompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });
        window.installApp = async () => {
            if(prompt) {
                prompt.prompt();
                prompt = null;
                document.getElementById('installBtn').classList.add('hidden');
            }
        };
    </script>
</body>
</html>
