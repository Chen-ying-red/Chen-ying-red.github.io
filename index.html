<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splash Test</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #111;
    color: #fff;
    font-family: sans-serif;
  }
  #splash {
    position: fixed;
    inset: 0;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    z-index: 999;
    cursor: pointer;
  }
</style>
</head>

<body>

<div id="splash">TAP OR PRESS SPACE</div>

<div id="app" style="display:none; padding:40px;">
  App is running
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
    const splash = document.getElementById('splash');
    const app = document.getElementById('app');

    function dismiss() {
        splash.remove();
        app.style.display = 'block';
    }

    splash.addEventListener('pointerdown', dismiss);
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') dismiss();
    });
});
</script>

</body>
</html>
