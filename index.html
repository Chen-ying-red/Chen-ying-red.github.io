<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#171717">
    <meta name="description" content="Professional SpeedCube Timer">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CubeTimer">
    
    <title>极速魔方计时器 | SpeedCube Timer</title>

    <!-- 图标引用 (使用 CDN 替代本地文件，确保显示) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS (使用官方脚本) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 优化：使用系统字体栈替代 Google Fonts，
           解决国内访问 GitHub Pages 白屏或加载慢的问题 
        */
        :root {
            --font-display: 'Montserrat', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'Menlo', 'Monaco', 'Consolas', "Liberation Mono", "Courier New", monospace;
        }

        body {
            font-family: var(--font-display);
            background-color: #171717; /* 对应 neutral-900 */
            color: #e5e5e5;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; /* 适配移动端动态高度 */
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .timer-font {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        .scramble-text {
            letter-spacing: 1px;
            line-height: 1.5;
            text-align: center;
            white-space: pre-wrap; 
            word-break: break-word;
        }

        /* 计时器状态颜色 */
        .timer-idle { color: #e5e5e5; }
        .timer-holding { color: #ef4444; transition: color 0.1s; } /* Red */
        .timer-ready { color: #22c55e; transition: color 0.1s; }   /* Green */
        .timer-running { color: #f5f5f5; }

        /* 触摸区域优化 */
        #touchArea {
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* 禁止在此区域滚动或缩放 */
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 适配刘海屏 */
        header { padding-top: max(env(safe-area-inset-top), 16px); }
        .safe-bottom { padding-bottom: max(env(safe-area-inset-bottom), 16px); }

        #historyList::-webkit-scrollbar { width: 4px; }
        #historyList::-webkit-scrollbar-thumb { background: #404040; border-radius: 2px; }

        /* SVG 魔方样式 */
        .cube-face { stroke: #000; stroke-width: 2px; rx: 1px; } /* 圆角 */
        .c-w { fill: #ffffff; }
        .c-y { fill: #ffd500; }
        .c-g { fill: #009e60; }
        .c-b { fill: #0051ba; }
        .c-r { fill: #c41e3a; }
        .c-o { fill: #ff5800; }
        .c-x { fill: #444444; }

        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            -webkit-appearance: none;
            appearance: none;
        }
        
        #visualizer svg {
            max-width: 100%;
            height: 100%;
            display: block;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* 隐藏移动端点击高亮 */
        button, select { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="flex justify-between items-center px-4 md:px-6 py-3 bg-neutral-900 border-b border-neutral-800 shrink-0 z-30">
        <div class="flex items-center gap-2">
            <!-- Logo Icon (Reverted to Original) -->
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            <div class="flex flex-col justify-center">
                <h1 class="text-xl font-extrabold tracking-tighter text-white leading-none">
                    CUBE<span class="text-blue-500">TIMER</span>
                </h1>
            </div>
        </div>
        <div class="flex gap-4 items-center">
            <!-- Settings / Reset History -->
            <button onclick="clearHistory()" class="text-neutral-500 hover:text-red-400 transition p-2" title="Clear History">
                <i class="fas fa-trash-alt"></i>
            </button>
        </div>
    </header>

    <!-- Main Interaction Area (Touch Zone) -->
    <main id="touchArea">
        
        <!-- Controls & Scramble -->
        <div class="flex flex-col items-center pt-4 z-20 w-full">
            <div class="relative mb-4">
                <select id="puzzleType" onchange="changePuzzleType()" class="bg-neutral-800 text-neutral-200 text-sm font-bold py-1.5 pl-4 pr-10 rounded-full border border-neutral-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition cursor-pointer shadow-lg">
                    <option value="333">3x3x3 Cube</option>
                    <option value="222">2x2x2 Cube</option>
                    <option value="444">4x4x4 Cube</option>
                </select>
            </div>

            <div id="scrambleDisplay" class="scramble-text text-lg md:text-2xl font-medium text-neutral-300 max-w-5xl px-4 cursor-pointer hover:text-white transition active:scale-95 select-text" onclick="newScramble()">
                <!-- Scramble inserted here -->
            </div>
        </div>

        <!-- Timer Display (Centered) -->
        <div class="flex-1 flex items-center justify-center flex-col z-10 w-full">
            <!-- Visualizer (Hidden while running) -->
            <div id="visualizer" class="mb-4 h-[140px] md:h-[180px] transition-opacity duration-200 opacity-100">
                <!-- SVG inserted here -->
            </div>

            <div id="timerDisplay" class="timer-font text-[22vw] md:text-[10rem] lg:text-[12rem] font-bold leading-none timer-idle select-none transition-colors duration-100">
                0.00
            </div>
            
            <div id="instruction" class="mt-4 text-neutral-600 text-xs font-bold uppercase tracking-[0.2em] text-center opacity-60 animate-pulse">
                <span class="hidden md:block">Press Space to Start</span>
                <span class="md:hidden">Hold to Start</span>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="w-full bg-neutral-900/80 backdrop-blur-md border-t border-neutral-800 p-3 md:p-4 z-20 safe-bottom shrink-0">
            <div class="max-w-4xl mx-auto grid grid-cols-4 gap-2 text-center">
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-neutral-500 font-bold tracking-wider">SOLVES</span>
                    <span id="statCount" class="text-lg font-mono font-bold text-white">0</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-neutral-500 font-bold tracking-wider">BEST</span>
                    <span id="statBest" class="text-lg font-mono font-bold text-blue-400">--</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-neutral-500 font-bold tracking-wider">Ao5</span>
                    <span id="statAo5" class="text-lg font-mono font-bold text-yellow-400">--</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-[10px] text-neutral-500 font-bold tracking-wider">Ao12</span>
                    <span id="statAo12" class="text-lg font-mono font-bold text-purple-400">--</span>
                </div>
            </div>
        </div>
    </main>

    <!-- History Panel -->
    <div class="bg-black border-t border-neutral-800 h-48 md:h-64 flex flex-col shrink-0">
        <div class="px-4 py-2 bg-neutral-900 flex justify-between items-center border-b border-neutral-800">
            <span class="text-[10px] font-bold text-neutral-500 uppercase tracking-wider">Session History</span>
        </div>
        <div id="historyList" class="flex-1 overflow-y-auto p-2 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2 content-start">
            <!-- History Items -->
        </div>
    </div>

    <!-- Logic -->
    <script>
        // --- 1. Cube Engine (Scramble & Visualize) ---
        const COLORS = { U: 'c-w', R: 'c-r', F: 'c-g', D: 'c-y', L: 'c-o', B: 'c-b' };
        
        function getSolvedState(size) {
            const faces = ['U', 'R', 'F', 'D', 'L', 'B'];
            const state = {};
            faces.forEach(f => state[f] = Array(size * size).fill(COLORS[f]));
            return state;
        }

        const MOVES_333 = {
            'U': (s) => cycleFace(s, 'U', [0,1,2,5,8,7,6,3]) & cycleSides(s, ['F', 'L', 'B', 'R'], [[0,1,2], [0,1,2], [0,1,2], [0,1,2]]),
            'D': (s) => cycleFace(s, 'D', [0,1,2,5,8,7,6,3]) & cycleSides(s, ['F', 'R', 'B', 'L'], [[6,7,8], [6,7,8], [6,7,8], [6,7,8]]),
            'F': (s) => cycleFace(s, 'F', [0,1,2,5,8,7,6,3]) & cycleSides(s, ['U', 'R', 'D', 'L'], [[6,7,8], [0,3,6], [2,1,0], [8,5,2]]),
            'B': (s) => cycleFace(s, 'B', [0,1,2,5,8,7,6,3]) & cycleSides(s, ['U', 'L', 'D', 'R'], [[2,1,0], [0,3,6], [6,7,8], [8,5,2]]),
            'L': (s) => cycleFace(s, 'L', [0,1,2,5,8,7,6,3]) & cycleSides(s, ['U', 'F', 'D', 'B'], [[0,3,6], [0,3,6], [0,3,6], [8,5,2]]),
            'R': (s) => cycleFace(s, 'R', [0,1,2,5,8,7,6,3]) & cycleSides(s, ['U', 'B', 'D', 'F'], [[8,5,2], [0,3,6], [8,5,2], [8,5,2]]),
        };

        const MOVES_222 = {
            'U': (s) => cycleFace(s, 'U', [0,1,3,2]) & cycleSides(s, ['F', 'L', 'B', 'R'], [[0,1], [0,1], [0,1], [0,1]]),
            'D': (s) => cycleFace(s, 'D', [0,1,3,2]) & cycleSides(s, ['F', 'R', 'B', 'L'], [[2,3], [2,3], [2,3], [2,3]]),
            'F': (s) => cycleFace(s, 'F', [0,1,3,2]) & cycleSides(s, ['U', 'R', 'D', 'L'], [[2,3], [0,2], [1,0], [3,1]]),
            'B': (s) => cycleFace(s, 'B', [0,1,3,2]) & cycleSides(s, ['U', 'L', 'D', 'R'], [[1,0], [0,2], [2,3], [3,1]]),
            'L': (s) => cycleFace(s, 'L', [0,1,3,2]) & cycleSides(s, ['U', 'F', 'D', 'B'], [[0,2], [0,2], [0,2], [3,1]]),
            'R': (s) => cycleFace(s, 'R', [0,1,3,2]) & cycleSides(s, ['U', 'B', 'D', 'F'], [[1,3], [2,0], [1,3], [1,3]]),
        };

        function cycleFace(state, face, indices) {
            const arr = state[face];
            const old = [...arr];
            if(indices.length === 8) { 
                const map = [6,3,0,7,4,1,8,5,2]; // Clockwise rotation mapping
                const newFace = arr.map((_, i) => old[map[i]]);
                state[face] = newFace;
            } else if (indices.length === 4) {
                const map = [2,0,3,1];
                const newFace = arr.map((_, i) => old[map[i]]);
                state[face] = newFace;
            }
            return 1;
        }

        function cycleSides(state, faces, indicesList) {
            const vals = faces.map((f, i) => indicesList[i].map(idx => state[f][idx]));
            indicesList[1].forEach((idx, i) => state[faces[1]][idx] = vals[0][i]);
            indicesList[2].forEach((idx, i) => state[faces[2]][idx] = vals[1][i]);
            indicesList[3].forEach((idx, i) => state[faces[3]][idx] = vals[2][i]);
            indicesList[0].forEach((idx, i) => state[faces[0]][idx] = vals[3][i]);
            return 1;
        }

        function applyMove(state, move, type) {
            const base = move[0];
            const mod = move.length > 1 ? move.slice(1) : "";
            const moveFunc = type === '333' ? MOVES_333[base] : MOVES_222[base];
            if (!moveFunc) return;
            let times = 1;
            if (mod === "2") times = 2;
            else if (mod === "'") times = 3;
            for(let k=0; k<times; k++) moveFunc(state);
        }

        function renderCubeSVG(state, type) {
            const size = type === '222' ? 2 : 3;
            const cellSize = 15;
            const gap = 2;
            const faceSize = size * cellSize;
            const offsets = {
                U: [faceSize + gap, 0],
                L: [0, faceSize + gap],
                F: [faceSize + gap, faceSize + gap],
                R: [(faceSize + gap) * 2, faceSize + gap],
                B: [(faceSize + gap) * 3, faceSize + gap],
                D: [faceSize + gap, (faceSize + gap) * 2]
            };
            
            let svgHTML = `<svg viewBox="0 0 ${faceSize*4 + gap*3} ${faceSize*3 + gap*2}" preserveAspectRatio="xMidYMid meet">`;
            ['U', 'L', 'F', 'R', 'B', 'D'].forEach(face => {
                const [ox, oy] = offsets[face];
                state[face].forEach((colorClass, idx) => {
                    const row = Math.floor(idx / size);
                    const col = idx % size;
                    svgHTML += `<rect x="${ox + col*cellSize}" y="${oy + row*cellSize}" width="${cellSize}" height="${cellSize}" class="cube-face ${colorClass}" />`;
                });
            });
            svgHTML += '</svg>';
            return svgHTML;
        }

        // --- 2. App State & Logic ---

        let currentPuzzle = '333';
        let currentScrambleStr = '';
        let appState = 'IDLE'; // IDLE, HOLDING, READY, RUNNING
        let timerStart = 0;
        let timerInt = null;
        let holdingTimeout = null;
        let solves = [];

        // Elements
        let elTimer, elScramble, elVisualizer, elSelect, elInstruction;

        function initApp() {
            elTimer = document.getElementById('timerDisplay');
            elScramble = document.getElementById('scrambleDisplay');
            elVisualizer = document.getElementById('visualizer');
            elSelect = document.getElementById('puzzleType');
            elInstruction = document.getElementById('instruction');

            loadHistory();
            newScramble();
            setupInteractions();
        }

        function changePuzzleType() {
            currentPuzzle = elSelect.value;
            // Hide visualizer for 4x4
            elVisualizer.style.display = currentPuzzle === '444' ? 'none' : 'block';
            newScramble();
            // Refresh stats because puzzle type changed
            renderHistory();
            updateStats();
        }

        function newScramble() {
            if (appState === 'RUNNING') return;
            
            currentScrambleStr = generateScrambleText(currentPuzzle);
            if(elScramble) elScramble.innerText = currentScrambleStr;

            if (currentPuzzle !== '444') {
                const state = getSolvedState(currentPuzzle === '222' ? 2 : 3);
                const moves = currentScrambleStr.split(' ');
                moves.forEach(m => applyMove(state, m, currentPuzzle));
                if(elVisualizer) {
                    elVisualizer.innerHTML = renderCubeSVG(state, currentPuzzle);
                    elVisualizer.style.opacity = '1';
                }
            }
        }

        function generateScrambleText(type) {
            let moves = [];
            let len = 20;
            let axis = []; 
            
            if (type === '222') {
                len = 9;
                axis = ['R', 'U', 'F']; 
            } else if (type === '333') {
                len = 20;
                axis = ['R', 'L', 'U', 'D', 'F', 'B'];
            } else if (type === '444') {
                len = 40;
                axis = ['R', 'L', 'U', 'D', 'F', 'B', 'Rw', 'Uw', 'Fw']; 
            }

            let lastAxis = -1;
            
            function getBaseAxis(move) {
                if (['R','L','Rw','Lw'].some(x => move.startsWith(x))) return 0;
                if (['U','D','Uw','Dw'].some(x => move.startsWith(x))) return 1;
                return 2;
            }

            for(let i=0; i<len; i++) {
                let r;
                let newAx;
                do {
                    r = Math.floor(Math.random() * axis.length);
                    newAx = getBaseAxis(axis[r]);
                } while (newAx === lastAxis); 
                
                lastAxis = newAx;
                
                let suffix = '';
                const rand = Math.random();
                if (rand < 0.33) suffix = "'";
                else if (rand < 0.66) suffix = "2";
                
                moves.push(axis[r] + suffix);
            }
            return moves.join(" ");
        }

        // --- 3. Timer Logic ---

        function formatTime(ms) {
            let s = Math.floor(ms / 1000);
            let m = Math.floor(ms % 1000 / 10);
            return `${s}.${m.toString().padStart(2, '0')}`;
        }

        function updateTimer() {
            const now = Date.now();
            elTimer.innerText = formatTime(now - timerStart);
        }

        function startTimer() {
            appState = 'RUNNING';
            timerStart = Date.now();
            elTimer.className = 'timer-font text-[22vw] md:text-[10rem] lg:text-[12rem] font-bold leading-none timer-running';
            
            elInstruction.style.opacity = '0';
            elVisualizer.style.opacity = '0';
            elScramble.style.opacity = '0.2'; // Dim but keep visible slightly? No, hide for focus
            elScramble.style.opacity = '0';
            
            // Disable interactions
            elSelect.disabled = true;

            timerInt = setInterval(updateTimer, 10);
        }

        function stopTimer() {
            clearInterval(timerInt);
            const finalTime = Date.now() - timerStart;
            appState = 'IDLE';
            
            elTimer.innerText = formatTime(finalTime);
            elTimer.className = 'timer-font text-[22vw] md:text-[10rem] lg:text-[12rem] font-bold leading-none timer-idle';

            elInstruction.style.opacity = '0.6';
            elVisualizer.style.opacity = '1';
            elScramble.style.opacity = '1';
            elSelect.disabled = false;

            saveSolve(finalTime);
            newScramble();
        }

        // --- 4. Interactions ---

        function handleDown(e) {
            // Ignore if clicking buttons
            if (e.target.closest('button') || e.target.closest('select')) return;

            if (appState === 'RUNNING') {
                stopTimer();
                return;
            }
            
            if (appState === 'IDLE') {
                appState = 'HOLDING';
                elTimer.className = 'timer-font text-[22vw] md:text-[10rem] lg:text-[12rem] font-bold leading-none timer-holding';
                elTimer.innerText = "0.00";

                holdingTimeout = setTimeout(() => {
                    if (appState === 'HOLDING') {
                        appState = 'READY';
                        elTimer.className = 'timer-font text-[22vw] md:text-[10rem] lg:text-[12rem] font-bold leading-none timer-ready';
                    }
                }, 300); // 300ms hold is friendlier
            }
        }

        function handleUp() {
            if (appState === 'READY') {
                startTimer();
            } else if (appState === 'HOLDING') {
                clearTimeout(holdingTimeout);
                appState = 'IDLE';
                elTimer.className = 'timer-font text-[22vw] md:text-[10rem] lg:text-[12rem] font-bold leading-none timer-idle';
            }
        }

        function setupInteractions() {
            // Keyboard
            document.addEventListener('keydown', e => {
                if (e.code === 'Space') {
                    if(!e.repeat && !e.target.closest('input')) {
                        e.preventDefault();
                        handleDown(e);
                    }
                }
            });
            document.addEventListener('keyup', e => {
                if (e.code === 'Space') handleUp();
            });

            // Touch
            const touchZone = document.getElementById('touchArea');
            
            touchZone.addEventListener('touchstart', e => {
                // Prevent scrolling ONLY on the touch zone, but allow button clicks
                if (!e.target.closest('button') && !e.target.closest('select')) {
                    // e.preventDefault(); // Don't prevent default globally, it breaks some Android interactions
                    handleDown(e);
                }
            }, { passive: false });

            touchZone.addEventListener('touchend', e => {
                handleUp();
            });
            
            touchZone.addEventListener('mousedown', e => {
                 if (!e.target.closest('button') && !e.target.closest('select')) {
                    handleDown(e);
                 }
            });
            touchZone.addEventListener('mouseup', handleUp);
        }

        // --- 5. Data & Stats ---

        function saveSolve(ms) {
            const s = { id: Date.now(), time: ms, type: currentPuzzle, scramble: currentScrambleStr };
            solves.unshift(s);
            localStorage.setItem('cubeSolvesV2', JSON.stringify(solves));
            renderHistory();
            updateStats();
        }

        function loadHistory() {
            const d = localStorage.getItem('cubeSolvesV2');
            if (d) {
                try { solves = JSON.parse(d); } catch(e) { solves = []; }
            }
            renderHistory();
            updateStats();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            const filtered = solves.filter( => .type === currentPuzzle);
            
            filtered.slice(0, 100).forEach((, i) => {
                const el = document.createElement('div');
                el.className = "bg-neutral-800 rounded p-2 flex justify-between items-center border border-neutral-700 text-xs hover:bg-neutral-700 transition";
                
                let timeStr = (.time / 1000).toFixed(2);
                let tagColor = .type === '333' ? 'text-blue-400' : (.type === '222' ? 'text-yellow-400' : 'text-purple-400');
                
                // Using onclick with string interpolation for ID is safe here for simple numbers
                el.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="font-mono text-neutral-500 w-4 text-right">${filtered.length - i}</span>
                        <span class="font-bold text-white text-base font-mono">${timeStr}</span>
                    </div>
                    <button onclick="delSolve(${.id})" class="text-neutral-600 hover:text-red-400 p-1"><i class="fas fa-times"></i></button>
                `;
                list.appendChild(el);
            });
        }

        // Exposed globally for onclick handlers
        window.delSolve = function(id) {
            if(!confirm('Delete this solve?')) return;
            solves = solves.filter( => .id !== id);
            localStorage.setItem('cubeSolvesV2', JSON.stringify(solves));
            renderHistory();
            updateStats();
        };

        window.clearHistory = function() {
            if(!confirm('Clear ALL history for all puzzles?')) return;
            solves = [];
            localStorage.removeItem('cubeSolvesV2');
            renderHistory();
            updateStats();
        };

        function updateStats() {
            const filtered = solves.filter( => .type === currentPuzzle);
            document.getElementById('statCount').innerText = filtered.length;
            
            if (filtered.length > 0) {
                const best = Math.min(...filtered.map( => .time));
                document.getElementById('statBest').innerText = (best / 1000).toFixed(2);
            } else {
                document.getElementById('statBest').innerText = "--";
            }
            document.getElementById('statAo5').innerText = calcAoN(filtered, 5);
            document.getElementById('statAo12').innerText = calcAoN(filtered, 12);
        }

        function calcAoN(list, n) {
            if (list.length < n) return "--";
            // Get the LAST n solves (which are at the beginning of the array in our structure)
            const subset = list.slice(0, n).map( => .time).sort((a,b)=>a-b);
            
            // Remove best and worst (standard WCA)
            // subset is sorted, so 0 is best (lowest), n-1 is worst (highest)
            let sum = 0;
            // Sum indices 1 to n-2
            for(let i=1; i<n-1; i++) sum += subset[i];
            
            return (sum / (n-2) / 1000).toFixed(2);
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

    </script>
</body>
</html>
