<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Theme Color -->
    <meta name="theme-color" content="#171717">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>极速魔方计时器 | SpeedCube Timer</title>

    <!-- Web App Manifest -->
    <link rel="manifest" id="manifest-placeholder">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .timer-font {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        .scramble-text {
            letter-spacing: 2px;
            line-height: 1.6;
            min-height: 3.5rem;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .timer-idle { color: #e5e5e5; }
        .timer-holding { color: #ef4444; }
        .timer-ready { color: #22c55e; }
        .timer-running { color: #e5e5e5; }

        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
        }
        .btn-install {
            animation: pulse-blue 2s infinite;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <header class="flex justify-between items-center px-6 py-4 bg-neutral-900 border-b border-neutral-800 safe-area-top">
        <div class="flex items-center gap-2">
            <i class="fas fa-cube text-blue-500 text-xl"></i>
            <h1 class="text-xl font-bold tracking-wide">CubeTimer</h1>
        </div>
        <div class="flex gap-4 items-center">
            <button id="installBtn" onclick="installApp()" class="hidden bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-1.5 px-3 rounded-full transition items-center gap-2 btn-install">
                <i class="fas fa-download"></i> 安装应用
            </button>
            <button onclick="clearHistory()" class="text-neutral-400 hover:text-red-400 transition" title="清空所有数据">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button onclick="toggleHelp()" class="text-neutral-400 hover:text-blue-400 transition" title="帮助">
                <i class="fas fa-question-circle"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative" id="touchArea">
        <div class="pt-8 px-4 text-center z-10">
            <div class="text-sm text-neutral-500 mb-2 font-bold uppercase tracking-widest">打乱公式 (Scramble)</div>
            <div id="scrambleDisplay" class="scramble-text text-xl md:text-3xl font-medium text-neutral-300 max-w-4xl mx-auto cursor-pointer hover:text-white transition" onclick="newScramble()">
                <!-- JS will inject scramble here -->
            </div>
        </div>

        <div class="flex-1 flex items-center justify-center flex-col z-10">
            <div id="timerDisplay" class="timer-font text-[20vw] md:text-[12rem] font-bold leading-none timer-idle transition-colors duration-100">
                0.00
            </div>
            <div id="instructionText" class="text-neutral-500 mt-4 text-sm md:text-base animate-pulse">
                <span class="hidden md:inline">按住 <kbd class="bg-neutral-800 px-2 py-1 rounded border border-neutral-700">空格</kbd> 准备</span>
                <span class="md:hidden">按住屏幕准备</span>
            </div>
        </div>

        <div class="w-full bg-neutral-900/80 border-t border-neutral-800 p-4 z-20 safe-area-bottom">
            <div class="max-w-4xl mx-auto grid grid-cols-4 gap-4 text-center">
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500 uppercase">次数</span>
                    <span id="statCount" class="text-xl font-bold text-white">0</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500 uppercase">最快</span>
                    <span id="statBest" class="text-xl font-bold text-blue-400">--</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500 uppercase">Ao5</span>
                    <span id="statAo5" class="text-xl font-bold text-yellow-400">--</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500 uppercase">Ao12</span>
                    <span id="statAo12" class="text-xl font-bold text-purple-400">--</span>
                </div>
            </div>
        </div>
    </main>

    <!-- History -->
    <div class="bg-neutral-900 border-t border-neutral-800 h-48 md:h-64 flex flex-col">
        <div class="px-4 py-2 bg-neutral-800 flex justify-between items-center">
            <span class="text-xs font-bold text-neutral-400 uppercase tracking-wider">历史记录</span>
        </div>
        <div class="flex-1 overflow-y-auto no-scrollbar p-2">
            <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2"></div>
        </div>
    </div>

    <!-- Help Modal -->
    <div id="helpModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm" onclick="toggleHelp()">
        <div class="bg-neutral-800 p-6 rounded-xl max-w-sm w-full mx-4 border border-neutral-700 shadow-2xl" onclick="event.stopPropagation()">
            <h2 class="text-xl font-bold mb-4 text-white">使用说明</h2>
            <ul class="space-y-3 text-neutral-300 text-sm">
                <li><b>电脑：</b>按住空格直至变绿，松开开始。</li>
                <li><b>手机：</b>长按屏幕直至变绿，松开开始。</li>
                <li><b>离线使用：</b>点击右上角“安装应用”即可。</li>
            </ul>
            <button onclick="toggleHelp()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium">确定</button>
        </div>
    </div>

    <script>
        // --- Core Variables ---
        let startTime = 0;
        let timerInterval = null;
        let state = 'IDLE'; 
        let solves = [];
        let currentScramble = "";
        let holdingTimeout = null;

        // --- Critical Initialization ---
        // Force immediate execution for scramble display
        function runImmediateInit() {
            const display = document.getElementById('scrambleDisplay');
            if (display) {
                currentScramble = generateScramble();
                display.innerText = currentScramble;
            }
        }

        // --- Scramble Generator ---
        function generateScramble() {
            const moves = ["U", "D", "L", "R", "F", "B"];
            const modifiers = ["", "'", "2"];
            let scramble = [];
            let lastMove = "";
            let secondLastMove = "";

            for (let i = 0; i < 20; i++) {
                let move;
                do {
                    move = moves[Math.floor(Math.random() * moves.length)];
                } while (move === lastMove || (move === secondLastMove && isOpposite(move, lastMove)));
                let modifier = modifiers[Math.floor(Math.random() * modifiers.length)];
                scramble.push(move + modifier);
                secondLastMove = lastMove;
                lastMove = move;
            }
            return scramble.join(" ");
        }

        function isOpposite(m1, m2) {
            const pairs = { 'U': 'D', 'D': 'U', 'L': 'R', 'R': 'L', 'F': 'B', 'B': 'F' };
            return pairs[m1] === m2;
        }

        function newScramble() {
            if(state === 'RUNNING') return;
            currentScramble = generateScramble();
            document.getElementById('scrambleDisplay').innerText = currentScramble;
        }

        // --- Timer Functions ---
        function formatTime(ms) {
            let seconds = Math.floor(ms / 1000);
            let milliseconds = Math.floor((ms % 1000) / 10);
            return `${seconds}.${milliseconds.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.innerText = formatTime(Date.now() - startTime);
        }

        function startTimer() {
            state = 'RUNNING';
            startTime = Date.now();
            timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none transition-colors duration-100 timer-running';
            document.getElementById('instructionText').style.opacity = '0';
            document.getElementById('scrambleDisplay').style.opacity = '0';
            timerInterval = setInterval(updateTimerDisplay, 10);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const finalTime = Date.now() - startTime;
            state = 'IDLE';
            timerDisplay.innerText = formatTime(finalTime);
            timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none transition-colors duration-100 timer-idle';
            document.getElementById('instructionText').style.opacity = '1';
            document.getElementById('scrambleDisplay').style.opacity = '1';
            saveSolve(finalTime);
            newScramble();
        }

        // --- Input Logic ---
        function handleInputDown() {
            if (state === 'RUNNING') { stopTimer(); return; }
            if (state === 'IDLE') {
                state = 'HOLDING';
                timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none transition-colors duration-100 timer-holding';
                timerDisplay.innerText = '0.00';
                holdingTimeout = setTimeout(() => {
                    if (state === 'HOLDING') {
                        state = 'READY';
                        timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none transition-colors duration-100 timer-ready';
                    }
                }, 300);
            }
        }

        function handleInputUp() {
            if (state === 'READY') { startTimer(); }
            else if (state === 'HOLDING') {
                clearTimeout(holdingTimeout);
                state = 'IDLE';
                timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none transition-colors duration-100 timer-idle';
            }
        }

        // --- Storage & Stats ---
        function saveSolve(timeMs) {
            const solve = { id: Date.now(), time: timeMs, scramble: currentScramble };
            solves.unshift(solve);
            localStorage.setItem('cubeSolves', JSON.stringify(solves));
            renderHistory();
            updateStats();
        }

        function updateStats() {
            document.getElementById('statCount').innerText = solves.length;
            if (solves.length > 0) {
                const best = Math.min(...solves.map(s => s.time));
                document.getElementById('statBest').innerText = formatTime(best);
            }
            document.getElementById('statAo5').innerText = calculateAoN(5);
            document.getElementById('statAo12').innerText = calculateAoN(12);
        }

        function calculateAoN(n) {
            if (solves.length < n) return '--';
            const recent = solves.slice(0, n).map(s => s.time).sort((a,b) => a-b);
            let sum = 0;
            for(let i=1; i<n-1; i++) sum += recent[i];
            return formatTime(sum / (n-2));
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            solves.slice(0, 20).forEach( => {
                const div = document.createElement('div');
                div.className = "bg-neutral-800 rounded p-2 flex justify-between items-center border border-neutral-700";
                div.innerHTML = `<span class="font-mono font-bold text-white">${formatTime(.time)}</span><span class="text-[10px] text-neutral-500 truncate w-20">${.scramble}</span>`;
                list.appendChild(div);
            });
        }

        function clearHistory() {
            if(confirm('清空所有记录？')) {
                solves = [];
                localStorage.removeItem('cubeSolves');
                renderHistory();
                updateStats();
            }
        }

        function toggleHelp() {
            const modal = document.getElementById('helpModal');
            modal.classList.toggle('hidden');
        }

        // --- Event Listeners ---
        document.addEventListener('keydown', (e) => { if(e.code === 'Space') { e.preventDefault(); handleInputDown(); } });
        document.addEventListener('keyup', (e) => { if(e.code === 'Space') handleInputUp(); });
        
        const touchArea = document.getElementById('touchArea');
        touchArea.addEventListener('touchstart', (e) => { if(!e.target.closest('button')) { e.preventDefault(); handleInputDown(); } }, {passive: false});
        touchArea.addEventListener('touchend', (e) => { if(!e.target.closest('button')) { e.preventDefault(); handleInputUp(); } });

        // --- Lifecycle ---
        const timerDisplay = document.getElementById('timerDisplay');
        
        // 1. Immediate Logic
        runImmediateInit();

        // 2. DOM Ready Logic
        document.addEventListener('DOMContentLoaded', () => {
            const data = localStorage.getItem('cubeSolves');
            if(data) solves = JSON.parse(data);
            renderHistory();
            updateStats();
            
            // PWA Manifest Init
            const manifest = {
                "name": "极速魔方计时器",
                "short_name": "CubeTimer",
                "display": "standalone",
                "start_url": ".",
                "theme_color": "#171717",
                "background_color": "#1a1a1a",
                "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/566/566300.png", "sizes": "512x512", "type": "image/png"}]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.querySelector('#manifest-placeholder').setAttribute('href', 网站.createObjectURL(blob));
        });

        // PWA Install
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });

        async function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                document.getElementById('installBtn').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
