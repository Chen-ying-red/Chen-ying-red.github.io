<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA Theme Color -->
    <meta name="theme-color" content="#171717">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>极速魔方计时器 | SpeedCube Timer</title>

    <!-- Web App Manifest -->
    <link rel="manifest" id="manifest-placeholder">

    <!-- 关键优化 1: 将 CSS 库改为异步加载，避免阻塞打乱公式生成 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    
    <!-- Tailwind CSS (GitHub 访问较慢时容易导致白屏，设为异步执行) -->
    <script src="https://cdn.tailwindcss.com" async></script>
    
    <style>
        /* 预设一些关键样式，防止异步 CSS 加载前页面闪烁 */
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .timer-font {
            font-family: monospace; /* 备用字体 */
            font-variant-numeric: tabular-nums;
        }

        .scramble-text {
            letter-spacing: 2px;
            line-height: 1.6;
            min-height: 3.5rem;
            text-align: center;
            padding: 20px;
        }

        .timer-idle { color: #e5e5e5; }
        .timer-holding { color: #ef4444; }
        .timer-ready { color: #22c55e; }
        .timer-running { color: #e5e5e5; }

        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            50% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 关键优化 2: 核心打乱逻辑移至 DOM 之前，确保它是最先解析的 JS -->
    <script>
        // 立即执行函数：生成打乱公式
        window.currentScramble = "";
        function generateScramble() {
            const moves = ["U", "D", "L", "R", "F", "B"];
            const modifiers = ["", "'", "2"];
            let scramble = [];
            let lastMove = "";
            let secondLastMove = "";

            for (let i = 0; i < 20; i++) {
                let move;
                do {
                    move = moves[Math.floor(Math.random() * moves.length)];
                } while (move === lastMove || (move === secondLastMove && (
                    (move === 'U' && lastMove === 'D') || (move === 'D' && lastMove === 'U') ||
                    (move === 'L' && lastMove === 'R') || (move === 'R' && lastMove === 'L') ||
                    (move === 'F' && lastMove === 'B') || (move === 'B' && lastMove === 'F')
                )));
                let modifier = modifiers[Math.floor(Math.random() * modifiers.length)];
                scramble.push(move + modifier);
                secondLastMove = lastMove;
                lastMove = move;
            }
            return scramble.join(" ");
        }

        function forceRenderScramble() {
            const display = document.getElementById('scrambleDisplay');
            if (display) {
                window.currentScramble = generateScramble();
                display.innerText = window.currentScramble;
                console.log("Scramble generated successfully");
            }
        }

        // 轮询检查 DOM，直到成功渲染
        const initInterval = setInterval(() => {
            if (document.getElementById('scrambleDisplay')) {
                forceRenderScramble();
                clearInterval(initInterval);
            }
        }, 10);
    </script>

    <!-- Navbar -->
    <header class="flex justify-between items-center px-6 py-4 bg-neutral-900 border-b border-neutral-800">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold tracking-wide">CubeTimer</h1>
        </div>
        <div class="flex gap-4 items-center">
            <button id="installBtn" onclick="installApp()" class="hidden bg-blue-600 text-white text-xs font-bold py-1.5 px-3 rounded-full">安装应用</button>
            <button onclick="clearHistory()" class="text-neutral-400 hover:text-red-400"><i class="fas fa-trash-alt"></i></button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative" id="touchArea">
        <div class="pt-8 px-4 text-center z-10">
            <div class="text-sm text-neutral-500 mb-2 font-bold uppercase tracking-widest">打乱公式 (Scramble)</div>
            <!-- 这里就是打乱显示区域 -->
            <div id="scrambleDisplay" class="scramble-text text-xl md:text-3xl font-medium text-neutral-400 max-w-4xl mx-auto cursor-pointer hover:text-white transition" onclick="newScramble()">
                Loading...
            </div>
        </div>

        <div class="flex-1 flex items-center justify-center flex-col z-10">
            <div id="timerDisplay" class="timer-font text-[20vw] md:text-[12rem] font-bold leading-none timer-idle">
                0.00
            </div>
        </div>

        <div class="w-full bg-neutral-900/80 border-t border-neutral-800 p-4 z-20">
            <div class="max-w-4xl mx-auto grid grid-cols-4 gap-4 text-center">
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500">次数</span>
                    <span id="statCount" class="text-xl font-bold">0</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500">最快</span>
                    <span id="statBest" class="text-xl font-bold text-blue-400">--</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500">Ao5</span>
                    <span id="statAo5" class="text-xl font-bold text-yellow-400">--</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500">Ao12</span>
                    <span id="statAo12" class="text-xl font-bold text-purple-400">--</span>
                </div>
            </div>
        </div>
    </main>

    <!-- History -->
    <div class="bg-neutral-900 border-t border-neutral-800 h-48 md:h-64 flex flex-col">
        <div class="px-4 py-2 bg-neutral-800"><span class="text-xs font-bold text-neutral-400">历史记录</span></div>
        <div id="historyList" class="flex-1 overflow-y-auto p-2 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2"></div>
    </div>

    <script>
        // 计时器核心变量
        let startTime = 0;
        let timerInterval = null;
        let state = 'IDLE'; 
        let solves = [];
        let holdingTimeout = null;

        const timerDisplay = document.getElementById('timerDisplay');

        function newScramble() {
            if(state === 'RUNNING') return;
            window.currentScramble = generateScramble();
            document.getElementById('scrambleDisplay').innerText = window.currentScramble;
        }

        // --- Timer Logic ---
        function formatTime(ms) {
            let seconds = Math.floor(ms / 1000);
            let milliseconds = Math.floor((ms % 1000) / 10);
            return `${seconds}.${milliseconds.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            timerDisplay.innerText = formatTime(Date.now() - startTime);
        }

        function startTimer() {
            state = 'RUNNING';
            startTime = Date.now();
            timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none timer-running';
            document.getElementById('scrambleDisplay').style.opacity = '0';
            timerInterval = setInterval(updateTimerDisplay, 10);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const finalTime = Date.now() - startTime;
            state = 'IDLE';
            timerDisplay.innerText = formatTime(finalTime);
            timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none timer-idle';
            document.getElementById('scrambleDisplay').style.opacity = '1';
            saveSolve(finalTime);
            newScramble();
        }

        // --- Interaction ---
        function handleInputDown() {
            if (state === 'RUNNING') { stopTimer(); return; }
            if (state === 'IDLE') {
                state = 'HOLDING';
                timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none timer-holding';
                holdingTimeout = setTimeout(() => {
                    if (state === 'HOLDING') {
                        state = 'READY';
                        timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none timer-ready';
                    }
                }, 300);
            }
        }

        function handleInputUp() {
            if (state === 'READY') startTimer();
            else if (state === 'HOLDING') {
                clearTimeout(holdingTimeout);
                state = 'IDLE';
                timerDisplay.className = 'timer-font text-[20vw] md:text-[12rem] font-bold leading-none timer-idle';
            }
        }

        // --- Storage ---
        function saveSolve(timeMs) {
            const solve = { id: Date.now(), time: timeMs, scramble: window.currentScramble };
            solves.unshift(solve);
            localStorage.setItem('cubeSolves', JSON.stringify(solves));
            renderHistory();
            updateStats();
        }

        function updateStats() {
            document.getElementById('statCount').innerText = solves.length;
            if (solves.length > 0) {
                const best = Math.min(...solves.map( => .time));
                document.getElementById('statBest').innerText = formatTime(best);
            }
            document.getElementById('statAo5').innerText = calculateAoN(5);
            document.getElementById('statAo12').innerText = calculateAoN(12);
        }

        function calculateAoN(n) {
            if (solves.length < n) return '--';
            const recent = solves.slice(0, n).map( => .time).sort((a,b) => a-b);
            let sum = 0;
            for(let i=1; i<n-1; i++) sum += recent[i];
            return formatTime(sum / (n-2));
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if(!list) return;
            list.innerHTML = '';
            solves.slice(0, 10).forEach( => {
                const div = document.createElement('div');
                div.className = "bg-neutral-800 rounded p-2 flex justify-between items-center border border-neutral-700 text-sm";
                div.innerHTML = `<span class="font-bold">${formatTime(.time)}</span><span class="text-[10px] text-neutral-500 truncate w-24">${.scramble}</span>`;
                list.appendChild(div);
            });
        }

        function clearHistory() {
            if(confirm('清空记录？')) {
                solves = [];
                localStorage.removeItem('cubeSolves');
                renderHistory();
                updateStats();
            }
        }

        // --- Events ---
        document.addEventListener('keydown', (e) => { if(e.code === 'Space') { e.preventDefault(); handleInputDown(); } });
        document.addEventListener('keyup', (e) => { if(e.code === 'Space') handleInputUp(); });
        
        document.addEventListener('DOMContentLoaded', () => {
            const touchArea = document.getElementById('touchArea');
            touchArea.addEventListener('touchstart', (e) => { if(!e.target.closest('button')) { e.preventDefault(); handleInputDown(); } }, {passive: false});
            touchArea.addEventListener('touchend', (e) => { if(!e.target.closest('button')) handleInputUp(); });

            const data = localStorage.getItem('cubeSolves');
            if(data) solves = JSON.parse(data);
            renderHistory();
            updateStats();
            
            // Generate PWA Manifest
            const manifest = {
                "name": "极速魔方计时器",
                "short_name": "CubeTimer",
                "display": "standalone",
                "start_url": ".",
                "theme_color": "#171717",
                "background_color": "#1a1a1a",
                "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/566/566300.png", "sizes": "512x512", "type": "image/png"}]
            };
            const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
            document.querySelector('#manifest-placeholder').setAttribute('href', 网站.createObjectURL(blob));
        });
    </script>
</body>
</html>
