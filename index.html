<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>极速魔方计时器 | SpeedCube Timer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Mono for timer) -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            overscroll-behavior: none; /* Prevent pull-to-refresh on mobile */
            user-select: none; /* Prevent text selection while tapping */
            -webkit-user-select: none;
        }
        
        .timer-font {
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
        }

        /* Scramble text style */
        .scramble-text {
            letter-spacing: 2px;
            line-height: 1.6;
        }

        /* Hide scrollbar for history list but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Mobile tap area highlight */
        .touch-active {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Timer states colors */
        .timer-idle { color: #e5e5e5; }
        .timer-holding { color: #ef4444; } /* Red */
        .timer-ready { color: #22c55e; }   /* Green */
        .timer-running { color: #e5e5e5; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Navbar / Header -->
    <header class="flex justify-between items-center px-6 py-4 bg-neutral-900 border-b border-neutral-800">
        <div class="flex items-center gap-2">
            <i class="fas fa-cube text-blue-500 text-xl"></i>
            <h1 class="text-xl font-bold tracking-wide">CubeTimer</h1>
        </div>
        <div class="flex gap-4">
            <button onclick="clearHistory()" class="text-neutral-400 hover:text-red-400 transition" title="清空所有数据">
                <i class="fas fa-trash-alt"></i>
            </button>
            <button onclick="toggleHelp()" class="text-neutral-400 hover:text-blue-400 transition" title="帮助">
                <i class="fas fa-question-circle"></i>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col relative" id="touchArea">
        
        <!-- Scramble Display -->
        <div class="pt-8 px-4 text-center z-10">
            <div class="text-sm text-neutral-500 mb-2 font-bold uppercase tracking-widest">打乱公式 (Scramble)</div>
            <div id="scrambleDisplay" class="scramble-text text-xl md:text-3xl font-medium text-neutral-300 max-w-4xl mx-auto cursor-pointer hover:text-white transition" onclick="newScramble()" title="点击生成新打乱">
                Loading...
            </div>
        </div>

        <!-- Timer Display -->
        <div class="flex-1 flex items-center justify-center flex-col z-10">
            <div id="timerDisplay" class="timer-font text-[20vw] md:text-[12rem] font-bold leading-none timer-idle transition-colors duration-100">
                0.00
            </div>
            <div id="instructionText" class="text-neutral-500 mt-4 text-sm md:text-base animate-pulse">
                <span class="hidden md:inline">按住 <kbd class="bg-neutral-800 px-2 py-1 rounded border border-neutral-700">空格</kbd> 准备</span>
                <span class="md:hidden">按住屏幕准备</span>
            </div>
        </div>

        <!-- Statistics Strip -->
        <div class="w-full bg-neutral-900/80 border-t border-neutral-800 p-4 z-20">
            <div class="max-w-4xl mx-auto grid grid-cols-4 gap-4 text-center">
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500 uppercase">次数</span>
                    <span id="statCount" class="text-xl font-bold text-white">0</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500 uppercase">最快 (Best)</span>
                    <span id="statBest" class="text-xl font-bold text-blue-400">--</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500 uppercase">Ao5</span>
                    <span id="statAo5" class="text-xl font-bold text-yellow-400">--</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-neutral-500 uppercase">Ao12</span>
                    <span id="statAo12" class="text-xl font-bold text-purple-400">--</span>
                </div>
            </div>
        </div>
    </main>

    <!-- History Sidebar (Slide-over on mobile, fixed on desktop right if expanded, currently bottom drawer style for simplicity) -->
    <div class="bg-neutral-900 border-t border-neutral-800 h-48 md:h-64 flex flex-col">
        <div class="px-4 py-2 bg-neutral-800 flex justify-between items-center">
            <span class="text-xs font-bold text-neutral-400 uppercase tracking-wider">历史记录</span>
            <span class="text-xs text-neutral-500">点击成绩可删除</span>
        </div>
        <div class="flex-1 overflow-y-auto no-scrollbar p-2">
            <div id="historyList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-2">
                <!-- History items will be injected here -->
            </div>
        </div>
    </div>

    <!-- Help Modal -->
    <div id="helpModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm" onclick="toggleHelp()">
        <div class="bg-neutral-800 p-6 rounded-xl max-w-sm w-full mx-4 border border-neutral-700 shadow-2xl" onclick="event.stopPropagation()">
            <h2 class="text-xl font-bold mb-4 text-white">使用说明</h2>
            <ul class="space-y-3 text-neutral-300 text-sm">
                <li class="flex items-start gap-2">
                    <i class="fas fa-desktop mt-1 text-blue-400"></i>
                    <span><b>电脑端：</b>按住空格键直到数字变绿，松开开始计时。再次按下空格停止。</span>
                </li>
                <li class="flex items-start gap-2">
                    <i class="fas fa-mobile-alt mt-1 text-green-400"></i>
                    <span><b>手机端：</b>手指按住计时区域直到变绿，松开开始。再次轻触屏幕停止。</span>
                </li>
                <li class="flex items-start gap-2">
                    <i class="fas fa-calculator mt-1 text-yellow-400"></i>
                    <span><b>统计：</b>自动计算Ao5（去头尾平均）和Ao12。</span>
                </li>
            </ul>
            <button onclick="toggleHelp()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-medium transition">明白了</button>
        </div>
    </div>

    <script>
        // --- Variables ---
        let startTime = 0;
        let timerInterval = null;
        let state = 'IDLE'; // IDLE, HOLDING, READY, RUNNING
        let solves = [];
        let currentScramble = "";
        let holdingTimeout = null;
        
        // DOM Elements
        const timerDisplay = document.getElementById('timerDisplay');
        const scrambleDisplay = document.getElementById('scrambleDisplay');
        const touchArea = document.getElementById('touchArea');
        const historyList = document.getElementById('historyList');
        const instructionText = document.getElementById('instructionText');

        // Stats Elements
        const statCount = document.getElementById('statCount');
        const statBest = document.getElementById('statBest');
        const statAo5 = document.getElementById('statAo5');
        const statAo12 = document.getElementById('statAo12');

        // --- Initialization ---
        window.onload = () => {
            loadHistory();
            newScramble();
            updateStats();
        };

        // --- Scramble Generator (3x3 WCA style simple) ---
        function generateScramble() {
            const moves = ["U", "D", "L", "R", "F", "B"];
            const modifiers = ["", "'", "2"];
            let scramble = [];
            let lastMove = "";
            let secondLastMove = "";

            for (let i = 0; i < 20; i++) {
                let move;
                do {
                    move = moves[Math.floor(Math.random() * moves.length)];
                } while (
                    move === lastMove || 
                    (move === secondLastMove && isOpposite(move, lastMove))
                );

                let modifier = modifiers[Math.floor(Math.random() * modifiers.length)];
                scramble.push(move + modifier);
                
                secondLastMove = lastMove;
                lastMove = move;
            }
            return scramble.join(" ");
        }

        function isOpposite(m1, m2) {
            const pairs = { 'U': 'D', 'D': 'U', 'L': 'R', 'R': 'L', 'F': 'B', 'B': 'F' };
            return pairs[m1] === m2;
        }

        function newScramble() {
            if(state === 'RUNNING') return;
            currentScramble = generateScramble();
            scrambleDisplay.innerText = currentScramble;
        }

        // --- Timer Logic ---
        function formatTime(ms) {
            let seconds = Math.floor(ms / 1000);
            let milliseconds = Math.floor((ms % 1000) / 10); // Show 2 decimal places
            return `${seconds}.${milliseconds.toString().padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            const now = Date.now();
            const diff = now - startTime;
            timerDisplay.innerText = formatTime(diff);
        }

        function startTimer() {
            state = 'RUNNING';
            startTime = Date.now();
            timerDisplay.classList.remove('timer-ready');
            timerDisplay.classList.add('timer-running');
            instructionText.style.opacity = '0';
            scrambleDisplay.style.opacity = '0';
            
            timerInterval = setInterval(updateTimerDisplay, 10);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const endTime = Date.now();
            const finalTime = endTime - startTime;
            state = 'IDLE';
            
            timerDisplay.innerText = formatTime(finalTime);
            timerDisplay.classList.remove('timer-running');
            timerDisplay.classList.add('timer-idle');
            instructionText.style.opacity = '1';
            scrambleDisplay.style.opacity = '1';

            saveSolve(finalTime);
            newScramble();
        }

        // --- Input Handling (Keyboard & Touch) ---
        
        // Keyboard
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent scrolling
                handleInputDown();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space') {
                handleInputUp();
            }
        });

        // Touch
        touchArea.addEventListener('touchstart', (e) => {
            if (e.target.closest('button') || e.target.closest('#historyList')) return;
            e.preventDefault();
            handleInputDown();
        }, { passive: false });

        touchArea.addEventListener('touchend', (e) => {
             if (e.target.closest('button') || e.target.closest('#historyList')) return;
            e.preventDefault();
            handleInputUp();
        });

        function handleInputDown() {
            if (state === 'RUNNING') {
                // Do nothing, wait for up to stop? No, usually touch down stops it immediately in some apps, 
                // but standard stackmat is stop on touch. Let's make ANY touch stop it.
                stopTimer();
                return;
            }

            if (state === 'IDLE') {
                state = 'HOLDING';
                timerDisplay.classList.remove('timer-idle');
                timerDisplay.classList.add('timer-holding'); // Red
                timerDisplay.innerText = '0.00';
                
                // Wait 0.3s to become ready
                holdingTimeout = setTimeout(() => {
                    if (state === 'HOLDING') {
                        state = 'READY';
                        timerDisplay.classList.remove('timer-holding');
                        timerDisplay.classList.add('timer-ready'); // Green
                    }
                }, 300);
            }
        }

        function handleInputUp() {
            if (state === 'RUNNING') {
                // If we stopped on keydown, do nothing here
                return;
            }

            if (state === 'READY') {
                startTimer();
            } else if (state === 'HOLDING') {
                // Released too early
                clearTimeout(holdingTimeout);
                state = 'IDLE';
                timerDisplay.classList.remove('timer-holding');
                timerDisplay.classList.add('timer-idle');
            }
        }

        // --- Statistics & History ---

        function saveSolve(timeMs) {
            const solve = {
                id: Date.now(),
                time: timeMs,
                scramble: currentScramble,
                date: new Date().toISOString()
            };
            solves.unshift(solve); // Add to beginning
            localStorage.setItem('cubeSolves', JSON.stringify(solves));
            
            addHistoryItem(solve);
            updateStats();
        }

        function deleteSolve(id) {
            if(!confirm('确定要删除这条成绩吗？')) return;
            solves = solves.filter(s => s.id !== id);
            localStorage.setItem('cubeSolves', JSON.stringify(solves));
            renderHistory();
            updateStats();
        }

        function clearHistory() {
            if(solves.length === 0) return;
            if(!confirm('确定要清空所有历史成绩吗？此操作无法撤销。')) return;
            solves = [];
            localStorage.removeItem('cubeSolves');
            renderHistory();
            updateStats();
            timerDisplay.innerText = "0.00";
        }

        function loadHistory() {
            const data = localStorage.getItem('cubeSolves');
            if (data) {
                solves = JSON.parse(data);
                renderHistory();
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            solves.forEach(solve => {
                addHistoryItem(solve);
            });
        }

        function addHistoryItem(solve) {
            const div = document.createElement('div');
            div.className = "bg-neutral-800 rounded p-3 flex justify-between items-center border border-neutral-700 group hover:border-neutral-600 transition";
            div.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden">
                    <span class="text-xl font-mono font-bold text-white">${formatTime(solve.time)}</span>
                    <span class="text-xs text-neutral-500 truncate w-24 md:w-32" title="${solve.scramble}">${solve.scramble}</span>
                </div>
                <button onclick="deleteSolve(${solve.id})" class="text-neutral-600 hover:text-red-500 p-1 opacity-0 group-hover:opacity-100 transition focus:opacity-100">
                    <i class="fas fa-times"></i>
                </button>
            `;
            // If rendering full list, append. If new solve, prepend.
            // But simplify: renderHistory clears all. 
            // This function is used by loadHistory (loop) or saveSolve.
            // For saveSolve we might want to just prepend to DOM, but re-rendering is safer for index sync.
            if(historyList.children.length > 0 && solves[0].id === solve.id && historyList.children.length === solves.length -1) {
                historyList.prepend(div);
            } else {
               historyList.appendChild(div);
            }
        }

        function calculateAoN(n) {
            if (solves.length < n) return '--';
            const recent = solves.slice(0, n).map( => .time);
            
            // WCA Style: Remove best and worst, avg rest
            recent.sort((a, b) => a - b); // Ascending
            
            // Remove smallest (index 0) and largest (index n-1)
            let sum = 0;
            for(let i = 1; i < n - 1; i++) {
                sum += recent[i];
            }
            return formatTime(sum / (n - 2));
        }

        function updateStats() {
            statCount.innerText = solves.length;
            
            // Best
            if (solves.length > 0) {
                const best = Math.min(...solves.map( => .time));
                statBest.innerText = formatTime(best);
            } else {
                statBest.innerText = '--';
            }

            // Ao5
            statAo5.innerText = calculateAoN(5);
            
            // Ao12
            statAo12.innerText = calculateAoN(12);
        }

        // --- UI Helpers ---
        function toggleHelp() {
            const modal = document.getElementById('helpModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
